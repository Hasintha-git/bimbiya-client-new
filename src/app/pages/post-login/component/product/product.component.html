<div class="product-glass-card card-resize">

  <!-- Image with overlay badges -->
  <div class="pgc-image-wrap">
    <img [src]="product.img" loading="lazy" alt="Food Image" class="pgc-image" />
    <div class="pgc-image-overlay"></div>

    <!-- Top badges -->
    <div class="pgc-badge-category">{{ product.productCategory }}</div>
    <div class="pgc-badge-portion" *ngIf="product.portionDescription">{{ product.portionDescription }}</div>

    <!-- Meal name anchored to bottom of image -->
    <div class="pgc-meal-name-wrap">
      <h2 class="pgc-meal-name">{{ product.mealName }}</h2>
    </div>
  </div>

  <!-- Separator -->
  <div class="pgc-sep"></div>

  <!-- Body -->
  <div class="pgc-body">

    <!-- Price -->
    <div class="pgc-price-row">
      <span class="pgc-price">LKR {{ product.price | number }}</span>
      <span class="pgc-price-suffix">.00</span>
    </div>

    <!-- Person count -->
    <div class="pgc-count-section">
      <p class="pgc-count-label">Person Count</p>
      <div class="pgc-count-row">
        <button type="button" class="pgc-count-btn" (click)="peronCountDown(product)">
          <img src="assets/icons/minus.svg" alt="Decrease" class="pgc-btn-icon">
        </button>
        <div class="pgc-count-display">{{ product.personCount }}</div>
        <button type="button" class="pgc-count-btn" (click)="peronCountUp(product)">
          <img src="assets/icons/plus.svg" alt="Increase" class="pgc-btn-icon">
        </button>
      </div>
    </div>

    <!-- Ingredients trigger -->
    <div class="pgc-ing-row" *ngIf="product.productCategory != 'BEVERAGES'">
      <button type="button" class="pgc-ing-btn" (click)="openIngredientsDialog()">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 8v4m0 4h.01"/>
        </svg>
        Ingredients
      </button>
    </div>

  </div>

  <!-- Footer separator -->
  <div class="pgc-footer-sep"></div>

  <!-- Add to Cart -->
  <div class="pgc-footer">
    <button type="button" class="pgc-cart-btn" (click)="addToCart()">
      <img src="assets/icons/checkout.svg" alt="Cart" class="pgc-cart-icon">
      Add to Cart
    </button>
  </div>

</div>
