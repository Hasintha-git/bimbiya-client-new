<!-- <app-navbar></app-navbar> -->
<div class="bg-gray-800">
  <div>
    <div class="relative z-40 lg:scroll" role="dialog" [ngClass]="{ block: isClosed, hidden: !isClosed }"
      aria-modal="true">
      <div class="fixed inset-0 bg-opacity-25"></div>

      <div class="fixed inset-0 z-40 flex">
        <div
          class="relative ml-auto flex h-full w-full max-w-xs flex-col bg-gray-800 overflow-y-auto py-4 pb-12 shadow-xl">
          <div class="flex items-center justify-between px-4">
            <h2 class="text-lg font-medium text-white">Filters</h2>
            <button (click)="toggleCloseMenu()" type="button"
              class="-mr-2 flex h-10 w-10 items-center justify-center rounded-md  p-2 text-white">
              <span class="sr-only">Close menu</span>
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
              </svg>
            </button>
          </div>

          <!-- Filters -->
          <form [formGroup]="productFilter" class="mt-4 border-t border-gray-200 overflow-y-auto">
            <h3 class="sr-only">Categories</h3>
            <ul role="list" class="px-2 py-3 font-medium text-white">
              <label class="relative inline-flex items-center cursor-pointer" style="margin-right: 10px;">
                <input type="checkbox" value="" [formControl]="foods" (change)="categoryChange('BITE')"
                  [disabled]="isBite" [(ngModel)]="isBite" class="sr-only peer">
                <div
                  class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                </div>
                <span class="ms-3 text-sm font-medium text-gray-900 text-white">Bite</span>
              </label>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" value="" [formControl]="beverages" [(ngModel)]="isBeverages"
                  [disabled]="isBeverages" (change)="categoryChange('BEVERAGES')" class="sr-only peer">
                <div
                  class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                </div>
                <span class="ms-3 text-sm font-medium text-gray-900 text-white">Beverages</span>
              </label>

            </ul>

            <div class="border-t border-gray-200 px-4 py-6" *ngIf="productCategory == 'BITE'">
              <h3 class="-mx-2 -my-3 flow-root">
                <!-- Expand/collapse section button -->
                <p type="button" class="flex w-full items-center justify-between text-white hover:text-blue"
                  aria-controls="filter-section-mobile-0" aria-expanded="false">
                  <span class="font-medium text-white">Portions</span>
                </p>
              </h3>
              <!-- Filter section, show/hide based on section state. -->
              <div class="pt-6" id="filter-section-mobile-0">
                <div class="space-y-6">
                  <div class="flex items-center" *ngFor="let portion of portionList">
                    <input id="filter-category-{{portion.code}}" name="category[]" [value]="portion.code"
                      (change)="onPortionChange(portion.code)" type="checkbox"
                      class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500 " style="cursor: pointer;" />
                    <label for="filter-category-{{portion.code}}" style="cursor: pointer;" (change)="onPortionChange(portion.code)"
                      class="ml-3 text-sm text-white">{{portion.description}}</label>
                  </div>


                </div>
              </div>
            </div>
            <div class="border-t border-gray-200 px-4 py-6" *ngIf="productCategory == 'BITE'">
              <h3 class="-mx-2 -my-3 flow-root">
                <!-- Expand/collapse section button -->
                <p type="button" class="flex w-full items-center justify-between text-white hover:text-blue"
                  aria-controls="filter-section-mobile-1" aria-expanded="false">
                  <span class="font-medium text-white">Ingredients</span>
                </p>
              </h3>
              <!-- Filter section, show/hide based on section state. -->
              <div class="pt-6" id="filter-section-mobile-1">
                <div class="space-y-6">
                  <div class="flex items-center" *ngFor="let ing of ingredientsList">
                    <input id="filter-category-{{ing.id}}" name="category[]" [value]="ing.id"
                      (change)="onIngredientChange(ing.id)" type="checkbox"  style="cursor: pointer;"
                      class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                    <label for="filter-category-{{ing.id}}" style="cursor: pointer;" (change)="onIngredientChange(ing.id)" class="ml-3 text-sm text-white">{{ing.description}}</label>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <main class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="flex items-baseline justify-between border-b border-gray-200 pb-6 pt-10">
        <h1 class="text-4xl font-bold tracking-tight text-white">{{section}}</h1>

        <div class="flex items-center">
          <div class="relative inline-block text-left">
            <div
              class="absolute right-0 z-10 mt-2 w-40 origin-top-right rounded-md shadow-2xl ring-1 ring-black ring-opacity-5 focus:outline-none bg-gray-800"
              role="menu" aria-orientation="vertical" aria-labelledby="menu-button" tabindex="-1"
              [ngClass]="{ block: isSort, hidden: !isSort }">
              <div class="py-1" role="none">

                <a href="#" class="font-medium text-white block px-4 py-2 text-sm" role="menuitem" tabindex="-1"
                  id="menu-item-0">Most Popular</a>
                <a href="#" class="text-white block px-4 py-2 text-sm" role="menuitem" tabindex="-1"
                  id="menu-item-1">Best Rating</a>
                <a href="#" class="text-white block px-4 py-2 text-sm" role="menuitem" tabindex="-1"
                  id="menu-item-2">Newest</a>
                <a href="#" class="text-white block px-4 py-2 text-sm" role="menuitem" tabindex="-1"
                  id="menu-item-3">Price: Low to High</a>
                <a href="#" class="text-white block px-4 py-2 text-sm" role="menuitem" tabindex="-1"
                  id="menu-item-4">Price: High to Low</a>
              </div>
            </div>
          </div>

          <button (click)="toggleCloseMenu()" id="mobile-view" type="button"
            class="-m-2 ml-4 p-2 text-white hover:text-blue sm:ml-6 lg:hidden">
            <span class="sr-only">Filters</span>
            <svg class="h-5 w-5" aria-hidden="true" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M2.628 1.601C5.028 1.206 7.49 1 10 1s4.973.206 7.372.601a.75.75 0 01.628.74v2.288a2.25 2.25 0 01-.659 1.59l-4.682 4.683a2.25 2.25 0 00-.659 1.59v3.037c0 .684-.31 1.33-.844 1.757l-1.937 1.55A.75.75 0 018 18.25v-5.757a2.25 2.25 0 00-.659-1.591L2.659 6.22A2.25 2.25 0 012 4.629V2.34a.75.75 0 01.628-.74z"
                clip-rule="evenodd" />
            </svg>
          </button>
        </div>
      </div>

      <section aria-labelledby="products-heading" class="pb-24 pt-6">
        <h2 id="products-heading" class="sr-only">Products</h2>

        <div class="grid grid-cols-1 gap-x-4 gap-y-6 lg:grid-cols-4">

          <!-- Filters -->
          <form class="hidden lg:block">


            <div class="border-b border-gray-200 py-6">
              <h3 class="-my-3 flow-root">
                <button type="button"
                  class="flex w-full items-center justify-between py-3 text-sm text-white hover:text-blue"
                  aria-controls="filter-section-0" aria-expanded="false">
                  <span class="font-medium text-white">Our Category</span>
                </button>
              </h3>
              <!-- Filter section, show/hide based on section state. -->
              <div id="filter-section-0" [ngClass]="{ block: isCategory, hidden: !isCategory }">
                <div class="space-y-4">
                  <div class="flex items-center">
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" [formControl]="foods" class="sr-only peer"
                        (change)="categoryChange('BITE')" [disabled]="isBite" [(ngModel)]="isBite">
                      <div
                        class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                      </div>
                      <span class="ms-3 text-sm font-medium text-gray-900 text-white">Bite</span>
                    </label>
                  </div>

                  <div class="flex items-center">
                    <label class="relative inline-flex items-center cursor-pointer">
                      <input type="checkbox" [formControl]="beverages" [(ngModel)]="isBeverages"
                        [disabled]="isBeverages" (change)="categoryChange('BEVERAGES')" class="sr-only peer">
                      <div
                        class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600">
                      </div>
                      <span class="ms-3 text-sm font-medium text-gray-900 text-white">Beverages</span>
                    </label>
                  </div>

                </div>
              </div>
            </div>

            <div class="border-b border-gray-200 py-6" *ngIf="productCategory == 'BITE'">
              <h3 class="-my-3 flow-root">
                <!-- Expand/collapse section button -->
                <p type="button"
                  class="flex w-full items-center justify-between text-sm text-white hover:text-blue"
                  aria-controls="filter-section-1" aria-expanded="false">
                  <span class="font-medium text-white">Portion</span>
                </p>
              </h3>
              <!-- Filter section, show/hide based on section state. -->
              <div class="pt-6" id="filter-section-1" [ngClass]="{ block: isPortion, hidden: !isPortion }">
                <div class="space-y-4">
                  <div class="flex items-center" *ngFor="let por of portionList">
                    <input id="filter-category-{{por.code}}" name="category[]" [value]="por.code"
                      (change)="onPortionChange(por.code)" type="checkbox" style="cursor: pointer;"
                      class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                    <label for="filter-category-{{por.code}}" style="cursor: pointer;" (change)="onPortionChange(por.code)"
                      class="ml-3 text-sm text-white">{{por.description}}</label>
                  </div>

                </div>
              </div>
            </div>
            <div class="border-b border-gray-200 py-6" *ngIf="productCategory == 'BITE'">
              <h3 class="-my-3 flow-root">
                <!-- Expand/collapse section button -->
                <p type="button"
                  class="flex w-full items-center justify-between text-sm text-white hover:text-blue"
                  aria-controls="filter-section-2" aria-expanded="false">
                  <span class="font-medium text-white">Ingredients</span>
                </p>
              </h3>
              <!-- Filter section, show/hide based on section state. -->
              <div class="pt-6" id="filter-section-2" [ngClass]="{ block: isIngredient, hidden: !isIngredient }">
                <div class="space-y-4">
                  <div class="flex items-center" *ngFor="let ing of ingredientsList">
                    <input id="filter-category-{{ing.id}}" name="category[]" [value]="ing.id"
                      (change)="onIngredientChange(ing.id)" type="checkbox" style="cursor: pointer;"
                      class="h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-500" />
                    <label for="filter-category-{{ing.id}}" style="cursor: pointer;" (change)="onIngredientChange(ing.id)" class="ml-3 text-sm text-white">{{ing.description}}</label>
                  </div>
                </div>
              </div>
            </div>

          </form>

          <!-- Product grid -->
          <div class="lg:col-span-3">
            <div class="card-list-container mobile-view">
              <ng-container *ngFor="let product of productList; let i = index">
                <div class="card-item">
                  <!-- Your app-product component here with product data binding -->
                  <app-product [product]="product"></app-product>
                </div>

                <!-- Add a margin between cards within the same line -->
                <div class="card-gap" *ngIf="(i + 1) % 2 !== 0"> <br></div>
                <!-- Close the row and start a new one after every 2 cards -->
                <div *ngIf="(i + 1) % 2 === 0" class="card-list-row"></div>
              </ng-container>
            </div>

            <div class="paginator">
              <mat-paginator [length]="products.length" [pageSize]="itemsPerPage" [pageIndex]="currentPage - 1"
                [pageSizeOptions]="[2, 4, 6, 8]" (page)="currentPage = $event.pageIndex + 1"  (page)="onPageChange()"></mat-paginator>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
