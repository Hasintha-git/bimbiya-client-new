<div class="flex">

    <div class="relative rounded-lg overflow-hidden" style="height: 300px;">
      <img class="w-full h-full object-cover" src="assets/images/BITE.png" alt="Image 1">
      <div class="overlay">
        <button (click)="routeToProduct('BITE')" class="btn">
          Shop Now 
        </button>
      </div>
      
    </div>
  </div>

  <div class="w-1/2 cart-div p-4" (click)="routeToProduct('BEVERAGES')" style="cursor: pointer;">
    <div class="relative rounded-lg overflow-hidden" style="height: 300px;">
      <img class="w-full h-full object-cover" src="assets/images/BEVERAGER.png" alt="Image 2">
      <div class="overlay">
        <button (click)="routeToProduct('BEVERAGES')" class="btn">Shop Now 
        </button>
      </div>
    </div>
  </div>
</div>
