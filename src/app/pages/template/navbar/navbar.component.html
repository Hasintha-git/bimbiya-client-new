<nav class="py-1 px-4 w-full z-10">
  <div class="mx-auto max-w-7xl px-2 sm:px-6 lg:px-8">
    <div class="relative flex h-16 items-center justify-between">
      <div class="absolute inset-y-0 left-0 flex items-center sm:hidden">
        <button id="mobileMenu" type="button" (click)="toggleMobileMenu()"
          class="relative inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white">
          <span class="absolute -inset-0.5"></span>
          <span class="sr-only">Open main menu</span>
          <svg class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
          </svg>
        </button>
      </div>

      <div class="flex flex-1 items-center justify-center sm:items-stretch sm:justify-start">
        <!-- Logo -->
        <div (click)="home()" style="cursor:pointer;display:flex;justify-content:center;height:40px;width:auto;align-items:center;padding:0;margin:0;">
          <img style="display:flex;height:70px;width:auto;padding:0;margin:0;" src="../assets/images/bimbiya.png" alt="Your Company">
        </div>

        <!-- Desktop Nav Links -->
        <div class="hidden sm:ml-6 sm:block">
          <div class="flex space-x-4 items-center">
            <a routerLink="/delivery/home" routerLinkActive="activated-route"
              class="animate-btn text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing">Home</a>

            <!-- BITE dropdown -->
            <div class="relative">
<button id="biteMenuBtn"
  (click)="toggleBiteDropdown($event)"
  class="animate-btn text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing focus:outline-none"
  style="display: inline-flex; align-items: center; gap: 6px; line-height: 1;"
  [ngClass]="{'activated-route': isBiteActive()}">
  
  Bite
  
  <svg style="width:12px; height:12px; flex-shrink:0;"
       [ngClass]="{'rotate-180': isBiteDropdownOpen}"
       [style.transition]="'transform 0.2s ease'"
       fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
  </svg>

</button>

              <!-- Bite Sub-category Dropdown -->
              <div id="biteDropdown"
                *ngIf="isBiteDropdownOpen"
                class="absolute top-full left-0 mt-2 w-48 rounded-xl shadow-2xl overflow-hidden bite-dropdown z-50">
                <div class="py-1">
                  <button
                    *ngFor="let cat of biteCategories"
                    (click)="navigateToBiteCategory(cat.code)"
                    class="w-full text-left px-4 py-3 text-sm text-gray-200 hover:text-white bite-dropdown-item flex items-center gap-3 transition-all duration-150">
                    <span class="w-1.5 h-1.5 rounded-full flex-shrink-0" style="background-color:#FFC001"></span>
                    {{ cat.description }}
                  </button>
                </div>
              </div>
            </div>

            <!-- BEVERAGES direct link -->
<button (click)="navigateToBeverages()"
  class="animate-btn text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing"
  [ngClass]="{'activated-route': isBeveragesActive()}">
  Beverages
</button>

            <a routerLink="/delivery/about" routerLinkActive="activated-route"
              class="animate-btn text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing">About</a>

            <a routerLink="/delivery/contact-us" routerLinkActive="activated-route"
              class="animate-btn text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing">Contact</a>
          </div>
        </div>
      </div>

      <!-- Right side: Cart + Profile -->
      <div class="absolute inset-y-0 right-0 flex items-center pr-2 sm:static sm:inset-auto sm:ml-6 sm:pr-0">
        <div class="relative ml-3">
          <button id="cartBtn" (click)="toggleCartMenu()" type="button"
            class="animate-btn relative bg-gray-800 rounded-full p-2 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800">
            <span class="sr-only">Cart</span>
            <img src="../assets/icons/cart.svg" alt="Cart" class="h-6 w-6" style="filter: grayscale(1) brightness(0) invert(1)">
          </button>
          <span class="absolute -top-1 -right-1 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full" style="background-color: #ffc001;">
            {{ cartCount }}
          </span>
        </div>

        <div class="relative ml-3">
          <button id="profileBtn" (click)="toggleProfileSidebar()" type="button"
            class="animate-btn relative bg-gray-800 rounded-full p-2 text-gray-400 hover:text-white focus:outline-none focus:ring-2 focus:ring-white focus:ring-offset-2 focus:ring-offset-gray-800">
            <span class="sr-only">Profile</span>
            <img src="../assets/icons/profile.svg" alt="Profile" class="h-7 w-7" style="filter: grayscale(1) brightness(0) invert(1)">
          </button>

          <!-- Cart Items Dropdown -->
          <div class="absolute backdrop-filter backdrop-blur-md bg-opacity-90 right-0 z-10 mt-2 w-72 origin-top-right rounded-md bg-gray-800 py-2 shadow-lg ring-1 ring-black ring-opacity-5 focus:outline-none"
            [ngClass]="{ block: isCart, hidden: !isCart }">
            <div *ngFor="let item of cartDetailsList" class="flex justify-between px-4 py-2 text-sm text-white text-center">
              <div class="flex justify-center items-center text-center">
                <span>{{ item.mealName }}</span>
              </div>
              <div style="cursor: pointer;">
                <img (click)="cartRemove(item.cartId)" src="assets/icons/ic_delete.svg" alt="">
              </div>
            </div>
            <div class="w-full flex justify-center">
              <button type="button" (click)="checkout()" style="color: #FFFFFF;"
                class="flex justify-center w-full px-4 py-2 text-sm font-medium"
                [style.background]="buttonHover ? '#374151' : 'transparent'"
                (mouseenter)="buttonHover = true" (mouseleave)="buttonHover = false">
                <img src="assets/icons/checkout.svg" alt="Cart Icon" class="w-5 h-5 me-2"
                  style="filter: invert(100%) sepia(0%) saturate(0%) hue-rotate(306deg) brightness(100%) contrast(100%);" />
                Checkout
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="sm:hidden" id="mobile-menu" [ngClass]="{ 'block': isMobileMenuOpen, 'hidden': !isMobileMenuOpen }">
    <div class="space-y-1 px-2 pb-3 pt-2">
      <a routerLink="/delivery/home" routerLinkActive="activated-route"
        class="block text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing">Home</a>

      <!-- Mobile Bite sub-categories -->
      <div class="px-3 py-2">
        <p class="text-xs font-bold uppercase tracking-widest mb-2" style="color:#FFC001">Bite</p>
        <div class="space-y-1 pl-2">
          <button *ngFor="let cat of biteCategories"
            (click)="navigateToBiteCategory(cat.code)"
            class="block w-full text-left text-white rounded-md px-3 py-1.5 text-sm font-medium custom-letter-spacing">
            {{ cat.description }}
          </button>
        </div>
      </div>

<button (click)="navigateToBeverages()"
  class="animate-btn text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing"
  [ngClass]="{'activated-route': isBeveragesActive()}">
  Beverages
</button>

      <a routerLink="/delivery/about" routerLinkActive="activated-route"
        class="block text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing">About</a>
      <a routerLink="/delivery/contact-us" routerLinkActive="activated-route"
        class="block text-white rounded-md px-3 py-2 text-sm font-medium custom-letter-spacing">Contact</a>
    </div>
  </div>
</nav>

<app-profile-sidebar
  [isSidebarOpen]="isProfileSidebarOpen"
  (sidebarClosed)="onProfileSidebarClosed()">
</app-profile-sidebar>
