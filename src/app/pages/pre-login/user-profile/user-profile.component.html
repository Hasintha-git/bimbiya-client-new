<link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<mat-sidenav-container class="post-login-container" autosize>
    <mat-sidenav #sidenav id="sidenav" class="post-login-sidenav" mode="side" [class.menu-open]="isVisible"
        [class.menu-close]="!isVisible" opened>
        <mat-list id="menus">
            <mat-card class="mat-elevation-z0">
                <mat-card-header style="display: flex;justify-content: center;">
                    <img class="post-login-logo" src="../../../../assets/images/bimbiya.png" routerLink="/dashboard"  alt="">
                </mat-card-header>
            </mat-card>
            <mat-list>
                <button routerLink="dashboard" routerLinkActive="activated-route" class="menu-item" mat-flat-button>
                      <img class="menu_img" src="../../../../assets/icons/dashboard.svg" alt="">
                    <span class="txt_route">Dashboard</span>
                </button>
            </mat-list>
            <mat-list>
                <button routerLink="profile" routerLinkActive="activated-route" class="menu-item" mat-flat-button>
                      <img class="menu_img" src="../../../../assets/icons/manage_profile.svg" alt="">
                    <span class="txt_route">Profile</span>
                </button>
            </mat-list>
              
        </mat-list>
      <div class="div_logout">
        <mat-list>
          <button (click)="goToShopping()" class="menu-item"
                  mat-flat-button>
            <img class="menu_img" src="../../../assets/icons/logout_FILL0_wght400_GRAD0_opsz48.svg" alt="">

            <span class="txt_route">Back to Shopping</span>
          </button>
        </mat-list>
      </div>
    </mat-sidenav>





    <mat-sidenav-content class="post-login-main-side">
        <mat-toolbar class="header-bar">

            <span class="active_router">{{activeRouter}}</span>
            <span class="example-spacer"></span>
            <!-- <button  mat-icon-button class="header-icon favorite-icon btn-signout" [matMenuTriggerFor]="menu"> -->
                <!-- <img   class="menu_img" src="../../../assets/icons/logout_FILL0_wght400_GRAD0_opsz48.svg" alt=""> -->
            <!-- </button> -->

            <!-- <mat-menu #menu="matMenu">
                <button mat-menu-item >
                  <mat-icon>lock_reset</mat-icon>
                  <span>Forget Password</span>
                </button>
            
                <button mat-menu-item  >
                    <mat-icon>logout</mat-icon>
                  <span>Logout</span>
                </button>
              </mat-menu> -->
        </mat-toolbar>
        <div class="body-area">
            <div class="sub-body-area">
                <router-outlet></router-outlet>
            </div>
        </div>
    </mat-sidenav-content>
</mat-sidenav-container>
