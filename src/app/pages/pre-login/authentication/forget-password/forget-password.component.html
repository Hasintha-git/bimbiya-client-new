<div class="input-dialog-container">

    <form class="space-y-6" (ngSubmit)="onSubmit()" [formGroup]="emailSent">
        <div class="btn-close" (click)="closeDialog()">
        </div>
        <div class="w-full h-full bg-gray-800 backdrop-filter backdrop-blur-md bg-opacity-40 p-6">
            <div class="sm:mx-auto sm:w-full sm:max-w-sm">
                <h2 class="mt-10 text-center text-2xl font-bold leading-9 tracking-tight text-white">Forget Password
                </h2>
            </div>

            <div class="mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
                <div>
                    <label for="email" class="block text-sm font-medium leading-6 text-white">Email address</label>
                    <div class="mt-2">
                        <input id="email" name="email" type="email" autocomplete="email" matInput
                            [formControl]="toEmail" [maxlength]="32" required [(ngModel)]="emailSent.toEmail" class="block w-full rounded-md border-0 py-1.5 text-gray-900
                                  shadow-md ring-1 ring-inset ring-gray-300 placeholder-gray-400
                                  focus:ring-2 focus:ring-inset focus:ring-indigo-600 sm:text-sm sm:leading-6">
                        <mat-error *ngIf="toEmail.hasError('required')">Email cannot be
                            empty
                        </mat-error>
                    </div>
                </div>

                <div>
                </div>

                <div>
                    <button type="submit" class="flex w-full justify-center rounded-md bg-indigo-600 px-3 py-1.5
                           text-sm font-semibold leading-6 text-white shadow-sm hover:bg-indigo-500
                           focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2
                           focus-visible:outline-indigo-600">Request Otp
                    </button>
                </div>

            </div>
        </div>
    </form>
</div>
