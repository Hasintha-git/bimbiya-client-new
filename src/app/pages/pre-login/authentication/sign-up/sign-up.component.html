<div class="main-viewport">
  <div class="signup-card">
    
    <header class="card-header">
      <!-- <div class="logo-box">
        <img src="assets/images/bimbiya_white.png" alt="Bimbiya Logo">
      </div> -->
      <h1>Create Account</h1>
      <p>Join the community in one simple step</p>
    </header>

    <div class="card-body">
      <form [formGroup]="signUpForm" (ngSubmit)="onSubmit()">
        
        <div class="field-row full-width">
          <label>Full Name</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="fullName" placeholder="Enter your full name" style="border: none; box-shadow: none;">
          </mat-form-field>
        </div>

        <div class="field-row full-width">
          <label>Email Address</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="email" placeholder="name@email.com" style="border: none; box-shadow: none;">
          </mat-form-field>
        </div>

        <div class="field-row full-width">
          <label>Mobile Number</label>
          <mat-form-field appearance="outline">
            <input matInput formControlName="mobile" placeholder="07XXXXXXXX" maxlength="10" (keypress)="onlyNumbers($event)" style="border: none; box-shadow: none;">
          </mat-form-field>
        </div>

        <div class="password-split">
          <div class="field-row">
            <label>Password</label>
            <mat-form-field appearance="outline">
              <input matInput [type]="hide ? 'password' : 'text'" formControlName="password" 
              placeholder="Enter your password"
              style="border: none; box-shadow: none;">
              <button type="button" mat-icon-button matSuffix (click)="hide = !hide" tabIndex="-1">
                <mat-icon style="color: white;">{{hide ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
            </mat-form-field>
          </div>
          <div class="field-row">
            <label>Confirm</label>
            <mat-form-field appearance="outline">
              <input matInput [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword" style="border: none; box-shadow: none;" placeholder="Re-enter your password">
                            <button type="button" mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm" tabIndex="-1">
                <mat-icon style="color: white;">{{hideConfirm ? 'visibility_off' : 'visibility'}}</mat-icon>
              </button>
            </mat-form-field>
          </div>
        </div>

        <p class="error-text" *ngIf="signUpForm.hasError('mismatch') && f['confirmPassword'].touched">
          Passwords do not match.
        </p>

        <button mat-flat-button class="btn-register" [disabled]="isLoading">
          <span *ngIf="!isLoading">Register Now</span>
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
        </button>
      </form>
    </div>

    <footer class="card-footer">
      Already have an account? <span (click)="signIn()">Log In</span>
    </footer>

  </div>
</div>
