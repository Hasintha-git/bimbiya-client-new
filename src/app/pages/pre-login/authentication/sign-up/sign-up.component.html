<div class="signup-wrap">
  <div class="signup-card">
    <div class="sc-header">
      <div class="sc-avatar"><mat-icon>person_add</mat-icon></div>
      <h2 class="sc-title">Create Account</h2>
      <p class="sc-subtitle">Join the Bimbiya community</p>
    </div>

    <form class="sc-body" (ngSubmit)="onSubmit()" [formGroup]="signUpForm">
      <div class="sc-field-group">
        <label class="sc-label">Full Name</label>
        <div class="sc-input-wrap" [class.sc-input-focused]="fullNameFocused" [class.sc-input-error]="f['fullName'].touched && f['fullName'].invalid">
          <input class="sc-input" type="text" placeholder="Your full name" formControlName="fullName" (focus)="fullNameFocused=true" (blur)="fullNameFocused=false">
          <mat-icon class="sc-input-icon">person</mat-icon>
        </div>
      </div>

      <div class="sc-field-group">
        <label class="sc-label">Email Address</label>
        <div class="sc-input-wrap" [class.sc-input-focused]="emailFocused" [class.sc-input-error]="f['email'].touched && f['email'].invalid">
          <input class="sc-input" type="email" placeholder="name@email.com" formControlName="email" (focus)="emailFocused=true" (blur)="emailFocused=false">
          <mat-icon class="sc-input-icon">mail</mat-icon>
        </div>
      </div>

      <div class="sc-field-group">
        <label class="sc-label">Mobile Number</label>
        <div class="sc-input-wrap" [class.sc-input-focused]="mobileFocused" [class.sc-input-error]="f['mobile'].touched && f['mobile'].invalid">
          <input class="sc-input" type="text" placeholder="07XXXXXXXX" maxlength="10" formControlName="mobile" (keypress)="onlyNumbers($event)" (focus)="mobileFocused=true" (blur)="mobileFocused=false">
          <mat-icon class="sc-input-icon">phone</mat-icon>
        </div>
      </div>

      <div class="sc-password-row">
        <div class="sc-field-group">
          <label class="sc-label">Password</label>
          <div class="sc-input-wrap" [class.sc-input-focused]="passwordFocused" [class.sc-input-error]="f['password'].touched && f['password'].invalid">
            <input class="sc-input" [type]="hide ? 'password' : 'text'" formControlName="password" (focus)="passwordFocused=true" (blur)="passwordFocused=false">
            <button type="button" class="sc-eye-btn" (click)="hide = !hide" tabindex="-1"><mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon></button>
          </div>
        </div>
        <div class="sc-field-group">
          <label class="sc-label">Confirm</label>
          <div class="sc-input-wrap" [class.sc-input-focused]="confirmFocused" [class.sc-input-error]="f['confirmPassword'].touched && signUpForm.hasError('mismatch')">
            <input class="sc-input" [type]="hideConfirm ? 'password' : 'text'" formControlName="confirmPassword" (focus)="confirmFocused=true" (blur)="confirmFocused=false">
            <button type="button" class="sc-eye-btn" (click)="hideConfirm = !hideConfirm" tabindex="-1"><mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon></button>
          </div>
        </div>
      </div>

      <button type="submit" class="sc-btn-register" [disabled]="isLoading">
        <mat-spinner diameter="16" *ngIf="isLoading"></mat-spinner>
        <mat-icon *ngIf="!isLoading">how_to_reg</mat-icon>
        <span *ngIf="!isLoading">Register Now</span>
      </button>

      <div class="sc-divider">
        <span class="sc-divider-line"></span>
        <span class="sc-divider-text">or continue with</span>
        <span class="sc-divider-line"></span>
      </div>

      <div class="sc-google-wrapper">
        <button type="button" class="sc-btn-google-visual" [class.loading]="isGoogleLoading">
          <span class="sc-google-spinner" *ngIf="isGoogleLoading"></span>
          <svg *ngIf="!isGoogleLoading" class="sc-google-icon" viewBox="0 0 24 24">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          <span class="sc-google-label">{{ isGoogleLoading ? 'Signing up...' : 'Sign up with Google' }}</span>
        </button>

        <div class="sc-google-overlay" (click)="onGoogleOverlayClick()" [class.disabled]="isGoogleLoading">
          <asl-google-signin-button type="standard" size="large" width="320"></asl-google-signin-button>
        </div>
      </div>
    </form>

    <div class="sc-footer">
      <p class="sc-login-text">Already have an account? <span class="sc-login-link" (click)="signIn()">Log In</span></p>
    </div>
  </div>
</div>
