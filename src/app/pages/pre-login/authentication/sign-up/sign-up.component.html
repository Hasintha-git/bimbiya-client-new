<div class="signup-wrap">
  <div class="signup-card">

    <!-- Header -->
    <div class="sc-header">
      <div class="sc-avatar">
        <mat-icon>person_add</mat-icon>
      </div>
      <h2 class="sc-title">Create Account</h2>
      <p class="sc-subtitle">Join the Bimbiya community</p>
    </div>

    <!-- Form -->
    <form class="sc-body" (ngSubmit)="onSubmit()" [formGroup]="signUpForm">

      <!-- Full Name -->
      <div class="sc-field-group">
        <label class="sc-label">Full Name</label>
        <div class="sc-input-wrap"
             [class.sc-input-focused]="fullNameFocused"
             [class.sc-input-error]="signUpForm.get('fullName')?.touched && signUpForm.get('fullName')?.invalid">
          <input class="sc-input"
                 type="text"
                 placeholder="Your full name"
                 formControlName="fullName"
                 (focus)="fullNameFocused=true"
                 (blur)="fullNameFocused=false">
          <mat-icon class="sc-input-icon">person</mat-icon>
        </div>
        <div class="sc-errors">
          <small *ngIf="signUpForm.get('fullName')?.touched && signUpForm.get('fullName')?.hasError('required')">
            Full name is required
          </small>
        </div>
      </div>

      <!-- Email -->
      <div class="sc-field-group">
        <label class="sc-label">Email Address</label>
        <div class="sc-input-wrap"
             [class.sc-input-focused]="emailFocused"
             [class.sc-input-error]="signUpForm.get('email')?.touched && signUpForm.get('email')?.invalid">
          <input class="sc-input"
                 type="email"
                 placeholder="name@email.com"
                 formControlName="email"
                 (focus)="emailFocused=true"
                 (blur)="emailFocused=false">
          <mat-icon class="sc-input-icon">mail</mat-icon>
        </div>
        <div class="sc-errors">
          <small *ngIf="signUpForm.get('email')?.touched && signUpForm.get('email')?.hasError('required')">Email is required</small>
          <small *ngIf="signUpForm.get('email')?.touched && signUpForm.get('email')?.hasError('email')">Enter a valid email</small>
        </div>
      </div>

      <!-- Mobile -->
      <div class="sc-field-group">
        <label class="sc-label">Mobile Number</label>
        <div class="sc-input-wrap"
             [class.sc-input-focused]="mobileFocused"
             [class.sc-input-error]="signUpForm.get('mobile')?.touched && signUpForm.get('mobile')?.invalid">
          <input class="sc-input"
                 type="text"
                 placeholder="07XXXXXXXX"
                 maxlength="10"
                 formControlName="mobile"
                 (keypress)="onlyNumbers($event)"
                 (focus)="mobileFocused=true"
                 (blur)="mobileFocused=false">
          <mat-icon class="sc-input-icon">phone</mat-icon>
        </div>
        <div class="sc-errors">
          <small *ngIf="signUpForm.get('mobile')?.touched && signUpForm.get('mobile')?.hasError('required')">Mobile number is required</small>
          <small *ngIf="signUpForm.get('mobile')?.touched && signUpForm.get('mobile')?.hasError('pattern')">Format must be 07XXXXXXXX</small>
        </div>
      </div>

      <!-- Password + Confirm (side by side) -->
      <div class="sc-password-row">

        <div class="sc-field-group" style="margin-bottom:0">
          <label class="sc-label">Password</label>
          <div class="sc-input-wrap"
               [class.sc-input-focused]="passwordFocused"
               [class.sc-input-error]="signUpForm.get('password')?.touched && signUpForm.get('password')?.invalid">
            <input class="sc-input"
                   [type]="hide ? 'password' : 'text'"
                   placeholder="Password"
                   formControlName="password"
                   (focus)="passwordFocused=true"
                   (blur)="passwordFocused=false">
            <button type="button" class="sc-eye-btn" (click)="hide = !hide" tabindex="-1">
              <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
          <div class="sc-errors">
            <small *ngIf="signUpForm.get('password')?.touched && signUpForm.get('password')?.hasError('required')">Required</small>
            <small *ngIf="signUpForm.get('password')?.touched && signUpForm.get('password')?.hasError('minlength')">Min 6 chars</small>
          </div>
        </div>

        <div class="sc-field-group" style="margin-bottom:0">
          <label class="sc-label">Confirm</label>
          <div class="sc-input-wrap"
               [class.sc-input-focused]="confirmFocused"
               [class.sc-input-error]="signUpForm.get('confirmPassword')?.touched && signUpForm.hasError('mismatch')">
            <input class="sc-input"
                   [type]="hideConfirm ? 'password' : 'text'"
                   placeholder="Re-enter"
                   formControlName="confirmPassword"
                   (focus)="confirmFocused=true"
                   (blur)="confirmFocused=false">
            <button type="button" class="sc-eye-btn" (click)="hideConfirm = !hideConfirm" tabindex="-1">
              <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
          <div class="sc-errors">
            <small *ngIf="signUpForm.get('confirmPassword')?.touched && signUpForm.hasError('mismatch')">
              Passwords don't match
            </small>
          </div>
        </div>

      </div>

      <!-- Submit -->
      <button type="submit" class="sc-btn-register" [disabled]="isLoading">
        <mat-spinner diameter="16" *ngIf="isLoading"></mat-spinner>
        <mat-icon *ngIf="!isLoading">how_to_reg</mat-icon>
        <span *ngIf="!isLoading">Register Now</span>
      </button>

    </form>

    <!-- Footer -->
    <div class="sc-footer">
      <p class="sc-login-text">
        Already have an account?
        <span class="sc-login-link" (click)="signIn()">Log In</span>
      </p>
    </div>

  </div>
</div>
